version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eclipselink-postgres
    environment:
      POSTGRES_DB: eclipselink
      POSTGRES_USER: eclipselink_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclipselink_user -d eclipselink"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eclipselink-network
    restart: unless-stopped

  # Redis (Cache & Queue)
  redis:
    image: redis:7-alpine
    container_name: eclipselink-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_dev_only}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eclipselink-network
    restart: unless-stopped

  # Backend API (Python FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: eclipselink-backend
    environment:
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}

      # Database
      DATABASE_URL: postgresql://eclipselink_user:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/eclipselink

      # Supabase (optional - for production)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # Security
      SECRET_KEY: ${SECRET_KEY:-dev_secret_change_in_production_use_openssl_rand_hex_32}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      # AI Services
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'

    ports:
      - "4000:4000"
    volumes:
      - ./apps/backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eclipselink-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: build
    container_name: eclipselink-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-development}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/public:/app/public
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - eclipselink-network
    restart: unless-stopped
    command: npm run dev
    stdin_open: true
    tty: true

networks:
  eclipselink-network:
    driver: bridge
    name: eclipselink-network

volumes:
  postgres_data:
    driver: local
    name: eclipselink-postgres-data
  redis_data:
    driver: local
    name: eclipselink-redis-data
