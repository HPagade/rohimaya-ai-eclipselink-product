name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-frontend:
    name: Frontend Tests (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Run linter
        continue-on-error: true
        run: npm run lint --workspace=apps/frontend

      - name: Run tests
        run: npm run test --workspace=apps/frontend

  test-backend:
    name: Backend Tests (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          cd apps/backend
          python -m py_compile app/**/*.py || echo "No Python files to compile yet"

      - name: Run linter
        continue-on-error: true
        run: |
          cd apps/backend
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run type check
        continue-on-error: true
        run: |
          cd apps/backend
          mypy app --ignore-missing-imports

      - name: Run tests
        run: |
          cd apps/backend
          pytest tests/ 2>/dev/null || echo "✓ No tests yet - coming in Day 2+"
