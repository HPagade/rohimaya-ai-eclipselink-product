name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint:frontend --if-present || npm run lint --workspace=apps/frontend

      - name: Run type check
        run: npm run type-check:frontend --if-present || npm run type-check --workspace=apps/frontend

      - name: Run tests
        run: npm run test:frontend --if-present || npm run test --workspace=apps/frontend

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint:backend --if-present || npm run lint --workspace=apps/backend

      - name: Run type check
        run: npm run type-check:backend --if-present || npm run type-check --workspace=apps/backend

      - name: Run tests
        run: npm run test:backend --if-present || npm run test --workspace=apps/backend
