[theme]
# EclipseLink AI Brand Colors
primaryColor = "#1a9b8e"        # Peacock Teal
backgroundColor = "#FFFFFF"      # White
secondaryBackgroundColor = "#f8f9fa"  # Moon White
textColor = "#1a2332"           # Eclipse Navy
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[runner]
magicEnabled = true
fastReruns = true

[client]
showErrorDetails = true
toolbarMode = "minimal"
