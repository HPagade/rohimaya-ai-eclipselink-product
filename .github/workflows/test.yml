name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-frontend:
    name: Frontend Tests (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Run linter
        run: npm run lint --workspace=apps/frontend --if-present

      - name: Run tests
        run: npm run test --workspace=apps/frontend --if-present

  test-backend:
    name: Backend Tests (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -r requirements.txt

      - name: Run linter
        run: |
          cd apps/backend
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run type check
        run: |
          cd apps/backend
          mypy app --ignore-missing-imports || true

      - name: Run tests
        run: |
          cd apps/backend
          pytest --ignore=tests || echo "No tests found yet"
