apiVersion: v1
kind: Namespace
metadata:
  name: eclipselink-prod
  labels:
    app: eclipselink
    environment: production
    owner: rohimaya-health-ai
---
# Resource quotas to prevent resource exhaustion
apiVersion: v1
kind: ResourceQuota
metadata:
  name: eclipselink-quota
  namespace: eclipselink-prod
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
---
# Limit ranges for default resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: eclipselink-limits
  namespace: eclipselink-prod
spec:
  limits:
  - max:
      cpu: "2"
      memory: 4Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 200m
      memory: 256Mi
    type: Container
