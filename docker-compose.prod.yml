# ============================================================================
# EclipseLink AI™ - Production Docker Compose
# ============================================================================
# This file is optimized for production deployment with:
# - Security hardening
# - Resource limits
# - Health checks
# - Automatic restarts
# - Logging configuration
# - Network isolation
# ============================================================================

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eclipselink-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eclipselink}
      POSTGRES_USER: ${POSTGRES_USER:-eclipselink_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eclipselink_user} -d ${POSTGRES_DB:-eclipselink}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eclipselink-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis (Cache & Queue)
  redis:
    image: redis:7-alpine
    container_name: eclipselink-redis-prod
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eclipselink-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API (Python FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    image: eclipselink-backend:latest
    container_name: eclipselink-backend-prod
    environment:
      # Environment
      ENVIRONMENT: production
      DEBUG: false

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-eclipselink_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eclipselink}

      # Supabase (if using)
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # Security
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      # AI Services
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eclipselink-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Run as non-root user
    user: "1000:1000"

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_ENVIRONMENT: production
    image: eclipselink-frontend:latest
    container_name: eclipselink-frontend-prod
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - eclipselink-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  eclipselink-network:
    driver: bridge
    name: eclipselink-network-prod
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
    name: eclipselink-postgres-data-prod
  redis_data:
    driver: local
    name: eclipselink-redis-data-prod

# ============================================================================
# PRODUCTION DEPLOYMENT INSTRUCTIONS
# ============================================================================
#
# 1. CREATE PRODUCTION ENV FILE:
#    cp .env.production.example .env.production
#    # Edit .env.production with your production values
#
# 2. VALIDATE CONFIGURATION:
#    docker compose -f docker-compose.prod.yml config
#
# 3. BUILD IMAGES:
#    docker compose -f docker-compose.prod.yml build
#
# 4. START SERVICES:
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# 5. VIEW LOGS:
#    docker compose -f docker-compose.prod.yml logs -f
#
# 6. CHECK HEALTH:
#    curl http://localhost:4000/health
#    curl http://localhost:4000/api/health/detailed
#
# 7. STOP SERVICES:
#    docker compose -f docker-compose.prod.yml down
#
# ============================================================================
# SECURITY NOTES
# ============================================================================
# - All passwords are required (will fail if not set)
# - Services run with resource limits
# - Non-root users where possible
# - Health checks for all services
# - Automatic restart on failure
# - Network isolation
# - Log rotation configured
#
# ============================================================================
# MONITORING
# ============================================================================
# Monitor with:
#   docker compose -f docker-compose.prod.yml ps
#   docker stats
#   docker compose -f docker-compose.prod.yml logs --tail=100 -f
#
# ============================================================================
