# ============================================================================
# IMPORTANT: This file contains sensitive data
# Before applying:
# 1. Replace all [PLACEHOLDER] values with actual base64-encoded secrets
# 2. NEVER commit this file with real values
# 3. Use sealed-secrets or external-secrets for production
# ============================================================================
#
# Generate base64 values:
#   echo -n "your-secret-here" | base64
#
# Generate secure passwords:
#   openssl rand -hex 32 | base64
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: eclipselink-secrets
  namespace: eclipselink-prod
type: Opaque
data:
  # Database credentials
  # Example: echo -n "changeme_strong_password_here" | base64
  postgres-password: W1BMQUNFSE9MREVSXQo=
  postgres-user: ZWNsaXBzZWxpbmtfdXNlcg==
  postgres-db: ZWNsaXBzZWxpbms=

  # Redis credentials
  # Example: echo -n "redis_strong_password_here" | base64
  redis-password: W1BMQUNFSE9MREVSXQo=

  # JWT secret key
  # Example: openssl rand -hex 32 | base64
  secret-key: W1BMQUNFSE9MREVSXQo=

  # AI API keys
  # Example: echo -n "sk-proj-xxxxxxxx" | base64
  openai-api-key: W1BMQUNFSE9MREVSXQo=
  # Example: echo -n "sk-ant-xxxxxxxx" | base64
  anthropic-api-key: W1BMQUNFSE9MREVSXQo=

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: eclipselink-config
  namespace: eclipselink-prod
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  OPENAI_WHISPER_MODEL: "whisper-1"
  ANTHROPIC_MODEL: "claude-sonnet-4-20250514"
  ANTHROPIC_MAX_TOKENS: "4096"
  MAX_UPLOAD_SIZE: "26214400"  # 25MB
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  LOG_LEVEL: "INFO"
  AUDIT_LOG_RETENTION_DAYS: "2555"  # 7 years for HIPAA
  SESSION_TIMEOUT_MINUTES: "15"
